name: Tests

# The suite on the monthly runner's image and Python, with no AWS: the update workflow can
# assume its role only from main, so this is what a branch can check before merge (#4).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --python 3.12
      - run: uv run --frozen pytest -q

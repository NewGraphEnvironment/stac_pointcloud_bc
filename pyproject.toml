[project]
name = "stac-pointcloud-bc"
version = "0.2.0"
description = "STAC items for LidarBC point clouds (.laz): listing, header read, item creation, validation."
requires-python = ">=3.12"
dependencies = [
    "pystac>=1.12.0",
    # The build reads the LAS header and VLRs only; lazrs is the LAZ backend, needed to
    # open a .laz at all even when no points are decompressed. 2.7: the class probe (#10)
    # relies on its chunk-table seek and CopcReader.query(level=range).
    "laspy[lazrs]>=2.7",
    "requests",
    "pyproj",
    "tqdm",
    # Registration and verification on pgstac, from its git tag (stacs README,
    # "Install"). The tag is also pinned by tests/test_stacs_config.py.
    "stacs",
]

[dependency-groups]
dev = [
    "pytest",
]
readme = [
    "matplotlib>=3.11.2",
    "pystac-client>=0.9.0",
]

[tool.uv.sources]
stacs = { git = "https://github.com/NewGraphEnvironment/stacs", tag = "v0.1.1" }

# Scripts-only repo, not an installable package; uv manages the environment.
[tool.uv]
package = false
